<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container bg-success p-5 mt-5 rounded">

        <form action="" method="post">

            <h2>Custom Sneaker Order Form</h2>

            <label for="form-name" class="form-label">Name:</label> 
            <input type="text" name="username" id="form-name" class="textinput form-control">

            <br>
        
            <label for="form-email" class="form-label">Email:</label> 
            <input type="email" name="emailaddress" id="form-email"class="textinput form-control">

            <br>

            <label for="form-tel" class="form-label">Telephone:</label> 
            <input type="tel" name="telephone" id="form-tel"class="textinput form-control">

            <br>

            <label for="form-story" class="form-label">Tell us about yourself:</label> 
            <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long" class="textinput form-control"></textarea>

            <br>
            
            <label for="sizes" class="form-label">Size:</label>
            <select name="size" id="sizes" class="form-select">
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
            </select> 
            
            <em>Sizes reflect standard US men's sizes</em>
                
                <label for="colors" class="form-label">Sneaker Color:</label>
                <fieldset id="colors">
                    <legend>Color</legend>

                    <div class="form-check">
                        <label class="form-check-label"><input type="radio" name="color" value="red" class="form-check-input"> Red</label>
                    </div>

                    <div class="form-check">
                        <label class="form-check-label"><input type="radio" name="color" value="blue" class="form-check-input"> Blue</label> 
                    </div>

                    <div class="form-check">
                    <label class="form-check-label"><input type="radio" name="color" value="black" class="form-check-input"> Black</label> 
                    </div>

                    <div class="form-check">
                    <label class="form-check-label"><input type="radio" name="color" value="silver" class="form-check-input"> Silver</label>
                    </div>
                </fieldset>

            <br>
                
            <label for="features" class="form-label">Add-on Features:</label>
            <fieldset id="features">
                <legend>Feature</legend>

                <div class="form-check">
                    <label class="form-check-label"><input type="checkbox" name="feature" value="laces" class="form-check-input"> Sparkley laces</label>
                </div>

                <div class="form-check">
                    <label class="form-check-label"><input type="checkbox" name="feature" value="logo" class="form-check-input"> Metallic logo</label>
                </div>

                <div class="form-check">
                    <label class="form-check-label"><input type="checkbox" name="feature" value="heels" class="form-check-input"> Light-up heels</label>
                </div>
                
                <div class="form-check">
                    <label class="form-check-label"><input type="checkbox" name="feature" value="mp3" class="form-check-input"> MP3-enabled</label>
                </div>
            </fieldset>

            <br>

            <button type="button" class="btn btn-danger" value="ENTER">ENTER
        </form>
        
    </div>
</body>
</html>
